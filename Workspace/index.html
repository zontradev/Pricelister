<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PriceLister Workspace</title>
    <script>
        (function() {
            try {
                var path = window.location.pathname || '';
                var isExplicitSignedOut = sessionStorage.getItem('pricelister_signed_out') === 'true';
                if (isExplicitSignedOut) {
                    window.location.replace('/index.html');
                    return;
                }
                var subroute = path.replace(/^\/workspace\/?/i, '').replace(/index\.html$/i, '').trim();
                if (subroute && subroute !== '/') {
                    try {
                        sessionStorage.setItem('pricelister_last_route', '/' + subroute.replace(/^\//, ''));
                    } catch(e) {}
                }
                window.location.replace('/app.html');
            } catch(e) {
                window.location.replace('/index.html');
            }
        })();
    </script>
</head>
<body style="background:#09090b; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
    <p>Opening PriceLister Workspace...</p>
</body>
</html>
