<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceLister Workspace</title>
    <script>
        (function() {
            try {
                if (!localStorage.getItem('pricelister_active_ws')) {
                    localStorage.setItem('pricelister_active_ws', 'ws_dev_mock');
                }
                sessionStorage.setItem('pricelister_last_route', '/overview');
            } catch(e) {}
            window.location.replace('/app.html');
        })();
    </script>
</head>
<body style="background:#09090b; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
    <p>Opening Workspace Overview...</p>
</body>
</html>
