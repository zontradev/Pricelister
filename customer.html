<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Customer Catalog & Shopping Cart — PriceLister</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Customer Portal CSS -->
    <link rel="stylesheet" href="css/customer-portal.css">
</head>
<body>
    <!-- App Root Container -->
    <div id="customer-app">
        <!-- Initial Full Loader -->
        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:80vh; gap:1rem;">
            <div style="width:40px; height:40px; border:3px solid #e2e8f0; border-top-color:#e11d48; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
            <p style="font-size:0.9rem; color:#64748b; font-family:'Inter',sans-serif;">Loading Store Catalog...</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- Client Module Entrypoint -->
    <script type="module">
        import { initCustomerPortal } from './js/customer-portal.js';

        document.addEventListener('DOMContentLoaded', () => {
            initCustomerPortal();
        });
    </script>
</body>
</html>
